<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailTrack ETA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- ================= REGISTER PAGE ================= -->

    <section id="registerPage" class="screen register-page">

        <div class="background-train">
            🚆
        </div>

        <div class="content">

            <div class="logo">
                🚆 <span>RailTrack</span> <b>ETA</b>
            </div>

            <h1>Start Your Journey</h1>

            <p class="tagline">
                Your journey starts here
            </p>

            <div class="form">

                <div class="input">
                    <span>📱</span>
                    <input
                        id="phone"
                        type="tel"
                        maxlength="10"
                        placeholder="Phone Number">
                </div>

                <div class="input">
                    <span>🔒</span>
                    <input
                        id="password"
                        type="password"
                        placeholder="Password">
                </div>

                <button
                    class="main-btn"
                    onclick="registerUser()">
                    REGISTER
                </button>

            </div>

            <p class="bottom-text">
                Already have an account?
                <button onclick="showLogin()">LOGIN</button>
            </p>

        </div>

    </section>


    <!-- ================= LOGIN PAGE ================= -->

    <section id="loginPage" class="screen login-page hidden">

        <div class="background-train second-train">
            🚆
        </div>

        <div class="content">

            <div class="logo">
                🚆 <span>RailTrack</span> <b>ETA</b>
            </div>

            <h1>Welcome Back</h1>

            <p class="tagline">
                Continue your journey
            </p>

            <div class="form">

                <div class="input">
                    <span>📱</span>
                    <input
                        id="loginPhone"
                        type="tel"
                        maxlength="10"
                        placeholder="Phone Number">
                </div>

                <div class="input">
                    <span>🔒</span>
                    <input
                        id="loginPassword"
                        type="password"
                        placeholder="Password">
                </div>

                <button
                    class="main-btn"
                    onclick="loginUser()">
                    LOGIN
                </button>

            </div>

            <p class="bottom-text">
                Don't have an account?
                <button onclick="showRegister()">REGISTER</button>
            </p>

        </div>

    </section>


    <!-- ================= SUCCESS PAGE ================= -->

    <section id="successPage" class="screen success-page hidden">

        <div class="success-content">

            <div class="success-icon">
                ✓
            </div>

            <h1>
                Registered!
            </h1>

            <h2>
                Your account was created successfully
            </h2>

            <p>
                You can now login to RailTrack ETA
                and continue your journey.
            </p>

            <button
                class="main-btn success-btn"
                onclick="showLogin()">
                LOGIN
            </button>

        </div>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
