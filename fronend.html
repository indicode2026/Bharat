<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RailTrack ETA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <!-- Colourful Background -->
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>


        <!-- Main Card -->
        <div class="auth-card">

            <!-- Train Illustration -->
            <div class="train-area">

                <div class="cloud cloud1"></div>
                <div class="cloud cloud2"></div>

                <div class="rail-track"></div>

                <div class="train">

                    <div class="train-top"></div>

                    <div class="train-body">

                        <div class="window"></div>
                        <div class="window"></div>

                        <div class="train-door"></div>

                    </div>

                    <div class="train-front">
                        <div class="light"></div>
                    </div>

                    <div class="wheel wheel1"></div>
                    <div class="wheel wheel2"></div>
                    <div class="wheel wheel3"></div>

                </div>

            </div>


            <!-- Logo -->
            <div class="logo">
                🚆 <span>RailTrack</span>
                <b>ETA</b>
            </div>


            <!-- REGISTER SCREEN -->
            <div id="registerScreen">

                <h1>
                    Start Your Journey
                </h1>

                <p class="subtitle">
                    Track your train journey with ease
                </p>


                <div class="input-box">

                    <span>📱</span>

                    <input
                        id="phone"
                        type="tel"
                        placeholder="Phone Number"
                        maxlength="10"
                    >

                </div>


                <div class="input-box">

                    <span>🔒</span>

                    <input
                        id="password"
                        type="password"
                        placeholder="Password"
                    >

                </div>


                <button
                    class="register-btn"
                    onclick="registerUser()">

                    REGISTER

                </button>


                <p class="login-text">

                    Already registered?

                    <button
                        onclick="showLogin()">

                        LOGIN

                    </button>

                </p>

            </div>


            <!-- LOGIN SCREEN -->
            <div
                id="loginScreen"
                class="hidden">

                <h1>
                    Welcome Back
                </h1>

                <p class="subtitle">
                    Continue your journey
                </p>


                <div class="input-box">

                    <span>📱</span>

                    <input
                        id="loginPhone"
                        type="tel"
                        placeholder="Phone Number"
                        maxlength="10"
                    >

                </div>


                <div class="input-box">

                    <span>🔒</span>

                    <input
                        id="loginPassword"
                        type="password"
                        placeholder="Password"
                    >

                </div>


                <button
                    class="register-btn"
                    onclick="loginUser()">

                    LOGIN

                </button>


                <p class="login-text">

                    New user?

                    <button
                        onclick="showRegister()">

                        REGISTER

                    </button>

                </p>

            </div>


            <!-- SUCCESS SCREEN -->
            <div
                id="successScreen"
                class="hidden success">

                <div class="success-icon">
                    ✓
                </div>

                <h1>
                    Registered!
                </h1>

                <p>
                    Your account has been
                    created successfully.
                </p>

                <button
                    class="register-btn"
                    onclick="showLogin()">

                    LOGIN

                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
