<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RailTrack ETA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= REGISTER PAGE ================= -->

    <div id="registerPage" class="page register-page">

        <!-- Background Train -->
        <div class="train-sketch">
            🚆
        </div>

        <div class="register-container">

            <div class="logo">
                🚆 RailTrack <span>ETA</span>
            </div>

            <h1>
                Start Your Journey
            </h1>

            <p class="subtitle">
                Create your account to continue
            </p>


            <!-- Phone -->

            <div class="input-box">

                <span>📱</span>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your number"
                    maxlength="10"
                >

            </div>


            <!-- Password -->

            <div class="input-box">

                <span>🔒</span>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >

            </div>


            <!-- Register -->

            <button
                class="main-button"
                onclick="registerUser()">

                REGISTER

            </button>


            <!-- Login -->

            <p class="login-option">

                Already registered?

                <button onclick="openLogin()">
                    LOGIN
                </button>

            </p>

        </div>

    </div>



    <!-- ================= SUCCESS PAGE ================= -->

    <div
        id="successPage"
        class="page success-page hidden">

        <div class="success-container">

            <div class="success-icon">
                ✓
            </div>

            <h1>
                You Registered Successfully!
            </h1>

            <p>
                Your RailTrack ETA account has been created.
            </p>

            <button
                class="main-button"
                onclick="openLogin()">

                LOGIN

            </button>

        </div>

    </div>



    <!-- ================= LOGIN PAGE ================= -->

    <div
        id="loginPage"
        class="page login-page hidden">

        <div class="login-container">

            <div class="logo">
                🚆 RailTrack <span>ETA</span>
            </div>

            <h1>
                Welcome Back
            </h1>

            <p class="subtitle">
                Login to continue your journey
            </p>


            <div class="input-box">

                <span>📱</span>

                <input
                    type="tel"
                    id="loginPhone"
                    placeholder="Enter your number"
                    maxlength="10"
                >

            </div>


            <div class="input-box">

                <span>🔒</span>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                >

            </div>


            <button
                class="main-button"
                onclick="loginUser()">

                LOGIN

            </button>


            <p class="login-option">

                Don't have an account?

                <button onclick="openRegister()">
                    REGISTER
                </button>

            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
